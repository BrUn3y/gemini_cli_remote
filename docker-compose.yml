name: gemini_cli_remote
services:
  gemini:
    build:
      context: .
      args:
        GEMINI_VERSION: "0.68.0"
    image: gemini_cli_remote
    command: ["serve-all"]
    init: true
    env_file:
      - .env
    environment:
      GEMINI_WORKDIR: /workspace
      HARNESS_HOST: 0.0.0.0
      HARNESS_PORT: "8080"
      GEMINI_REMOTE_URL: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:${HARNESS_PORT:-8081}:8080"
    volumes:
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
